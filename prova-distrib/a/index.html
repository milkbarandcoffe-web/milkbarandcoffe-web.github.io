<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prova A</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prova A">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117}
#app{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:block;background:#0d1117}
#ins{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;display:none;align-items:center;gap:10px;padding:0 6px 0 18px;height:46px;border-radius:23px;background:#0d6efd;color:#fff;font:700 15px system-ui,-apple-system,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.45)}
#ins b{cursor:pointer}#ins i{font-style:normal;display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;border-radius:17px;background:rgba(255,255,255,.22);cursor:pointer}
#ios{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;display:none;padding:14px 46px 14px 16px;border-radius:14px;background:#0d6efd;color:#fff;font:15px/1.35 system-ui,-apple-system,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.45)}
#ios i{font-style:normal;position:absolute;right:8px;top:50%;margin-top:-17px;width:34px;height:34px;line-height:34px;text-align:center;border-radius:17px;background:rgba(255,255,255,.22)}
#ok{position:fixed;left:10px;right:10px;top:calc(12px + env(safe-area-inset-top));z-index:9;display:none;padding:14px 16px;border-radius:14px;background:#2da44e;color:#fff;text-align:center;font:600 15px/1.35 system-ui,-apple-system,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.45)}
</style>
</head><body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyAh-bMW8eDfsDe_l0dtvwUUSHK2R9ryDcCPxMD4zuZAL_UxYPTpTUh4biczE_Ell--yA/exec#pwa=1" title="Prova A" allow="clipboard-read; clipboard-write; fullscreen; geolocation; microphone; camera; autoplay; screen-wake-lock" allowfullscreen></iframe>
<div id="ins"><b id="insb">INSTALLA</b><i id="insx">&#10005;</i></div>
<div id="ok">App installata: la trovi anche nella schermata Home.</div>
<div id="ios">Per installare: tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>.<i id="iosx">&#10005;</i></div>
<script>
(function(){
var inst=window.matchMedia("(display-mode: standalone)").matches||window.matchMedia("(display-mode: fullscreen)").matches||window.navigator.standalone===true;
function g(i){return document.getElementById(i);}
function mem(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
var dp=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;if(!inst)g("ins").style.display="flex";});
var fatto=false;
function installata(){if(fatto)return;fatto=true;dp=null;g("ins").style.display="none";g("ok").style.display="block";setTimeout(function(){g("ok").style.display="none";},6000);setTimeout(function(){var f=g("app");f.src=f.getAttribute("src");},800);}
g("insb").onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(r){if(r&&r.outcome==="accepted")installata();else{dp=null;g("ins").style.display="none";}},function(){});};
g("insx").onclick=function(){g("ins").style.display="none";};
window.addEventListener("appinstalled",installata);
var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
if(ios&&!inst&&mem("pwa-ios-no")!=="1")g("ios").style.display="block";
g("iosx").onclick=function(){g("ios").style.display="none";mem("pwa-ios-no","1");};
})();
</script></body></html>
