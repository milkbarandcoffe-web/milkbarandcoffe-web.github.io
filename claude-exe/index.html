      { da: 'tu', t: 'Crea un\'app per segnare le ore di lavoro.' },
      { da: 'ai', t: 'Creata e pubblicata. Ecco il link.' }
    ],
    firma: 'Un progetto di Daniel Zavan'
  },
  slide: [
    { t: 'Un\'intelligenza artificiale con le mani.',

    { t: 'Come funziona.',

    { t: 'Cosa sa fare.',

    { t: 'Niente va perso.',

    { t: 'Lavora anche con altre AI.',

    { t: 'Le app arrivano agli amici con una chiave.', chiave: true,

    { t: 'Tutto dal telefono.',
      x: 'Daniel non usa un computer. Il lavoro tecnico lo fa Claude: lui spiega cosa vuole, guarda il risultato e approva.',

    { t: 'Una mattina qualunque.',
