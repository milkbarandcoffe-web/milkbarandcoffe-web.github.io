<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>DZ Auto</title>
  <!-- Porta per l'app DZ_AUTO_LIGHTROOM: legge l'indirizzo giusto ("aiuto" in dzauto.json) e ci va con il codice.
       Il codice arriva dopo # (non va a nessun server) e viene tolto subito dalla barra dell'indirizzo. -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: linear-gradient(135deg, #10233f 0%, #1d4fa8 100%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .box { background: #fff; border-radius: 22px; padding: 26px 22px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .logo { width: 52px; height: 52px; border-radius: 16px; background: #1d4fa8; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; margin: 0 auto 12px; }
    h1 { margin: 0 0 8px; font-size: 20px; color: #10233f; }
    p { margin: 0; color: #5b6577; font-size: 14px; line-height: 1.5; }
    a { display: none; margin-top: 16px; background: #1d6fe0; color: #fff; border-radius: 12px; padding: 14px; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">DZ</div>
    <h1>Apro DZ Auto…</h1>
    <p id="t">Un attimo.</p>
    <a id="a" href="#">APRI</a>
  </div>
  <script>
    (function () {
      var testo = document.getElementById('t');
      var m = (location.hash.slice(1) + '&' + location.search.slice(1)).match(/(?:^|&)c=([A-Za-z0-9]+)/);
      var c = m ? m[1] : '';
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      fetch('../dzauto.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          var u = String(cfg.aiuto || '');
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) throw new Error('indirizzo');
          var dest = u + (c ? '?c=' + c : '');
          var a = document.getElementById('a');
          a.href = dest;
          a.style.display = 'block';
          testo.textContent = 'Se non si apre da solo, tocca APRI.';
          location.replace(dest);
        })
        .catch(function () {
          testo.textContent = 'Non riesco a leggere l\'indirizzo dell\'app: controlla internet e riprova.';
        });
    })();
  </script>
</body>
</html>
