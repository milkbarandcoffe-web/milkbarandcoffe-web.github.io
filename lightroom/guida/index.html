<title>DZ Auto guida</title>
<meta name="description" content="Guida parlata di DZ Auto 2.0 per Lightroom Classic: installazione, pannello, prova, Torna come prima.">

<style>
:root{--fondo:#0E1A2B;--fondo2:#17304D;--carta:#EAF2FB;--tenue:#9FB4CC;--accento:#5AB0FF;--su-accento:#06182B;--linea:rgba(234,242,251,.16)}
</style>

<body>
<noscript>Per ascoltare la guida serve JavaScript attivo.</noscript>
<script>
// Guida del plugin DZ Auto 2.0 per Luca (13/11/2026): il pannello. Indice e Domande in basso.
window.PRES = {
  id: 'guida-dzauto-2',
  marchio: 'DZ Auto · guida',
  vel: 1.2,
  tono: 0.85,
  strumenti: ['indice', 'voce', 'domande'],
  domande: { t: 'Scrivi domande o suggerimenti', href: 'https://milkbarandcoffe-web.github.io/dzauto-domande/' },
  pronuncia: [['DZ Auto', 'Di Zeta Auto'], ['DZAuto.lrplugin', 'Di Zeta Auto punto lrplugin'], ['Lightroom', 'Lait rum'], ['plug-in', 'plag in'], ['Z6 II', 'Zeta 6 seconda'], ['JPEG', 'gei peg'], ['iPhone', 'aifon'], ['copyright', 'copirait'], ['Finder', 'Fainder'], ['Adobe', 'Adobi'], ['Upright', 'Apràit'], ['Cmd', 'Comando']],
  inizio: {
    t: 'DZ Auto 2.0, la guida',
    x: 'Un pannello, un tasto AVVIA: il Mac sistema il servizio mentre tu fai altro. Alza il volume e tocca play. In basso trovi Indice e Domande.',
    firma: 'idea e sviluppo by Daniel Zavan'
  },
  slide: [
    { sez: 'Inizio', t: 'Ciao Luca!',
      x: 'Importi il servizio, apri il pannello DZ Auto, premi AVVIA e ti alzi. Quando torni le foto sono sistemate e in una raccolta da controllare.',
      v: 'Ciao Luca! Questa è la guida di DZ Auto due punto zero. L\'idea è semplice: importi il servizio, apri il pannello di DZ Auto, premi Avvia e ti alzi. Quando torni, le foto sono sistemate e le trovi in una raccolta, pronte da controllare. Tu ritocchi solo dove serve, ed esporti come sempre.' },

    { sez: 'Inizio', t: 'Cosa fa, foto per foto.',
      l: ['Il tuo stile per fotocamera, con la forza che vuoi', 'Bianco automatico: via le dominanti', 'Esposizione e contrasto automatici', 'Raddrizza le foto storte', 'Bianco e nero con l\'etichetta che scegli', 'Firma, mail sull\'iPhone, tempo risparmiato'],
      v: 'Cosa fa, foto per foto? Mette il tuo stile, cioè il preset giusto per la D850 e per la Zeta 6 seconda, con la forza che scegli. Poi il bianco automatico, che toglie le dominanti, ed esposizione e contrasto automatici, dopo il tuo stile. Raddrizza le foto storte con Upright Livello di Lightroom. Mette il bianco e nero sulle foto che segni tu con un\'etichetta. Scrive firma e copyright, ti avvisa sull\'iPhone quando ha finito e ti dice quanto tempo hai risparmiato.' },

    { sez: 'Inizio', t: 'È sicuro? Sì.',
      l: ['Prima di toccare una foto salva l\'istantanea "DZ Auto - prima": Torna come prima rimette tutto com\'era', 'File originali mai modificati, niente cancellato o spostato', 'Plug-in ufficiale: non tocca programma, account o abbonamento Adobe', 'Internet solo per chiave, impostazioni, avviso e un conteggio anonimo: le foto restano sul Mac'],
      v: 'È sicuro? Sì. Prima di toccare una foto, DZ Auto salva un\'istantanea che si chiama DZ Auto prima. Con un solo comando, Torna come prima, rimette tutte le foto com\'erano. I file originali non vengono mai modificati, e non cancella né sposta niente. Usa la funzione plug-in ufficiale di Lightroom, quindi non tocca il programma, l\'account o l\'abbonamento Adobe. Internet serve solo per la chiave, le impostazioni, l\'avviso e un conteggio anonimo fatto solo di numeri: le foto non escono mai dal Mac.' },

    { sez: 'Inizio', t: 'Un solo limite.',
      x: 'Un difetto noto di Adobe può rallentare Lightroom con molti preset che contengono maschere AI. DZ Auto lavora a gruppi di 10 foto. La prima volta su un servizio usa "Prova su 20 foto".',
      v: 'Un solo limite, per onestà: un difetto noto di Adobe può rallentare Lightroom quando si applicano molti preset con maschere intelligenti. Per questo DZ Auto lavora a gruppi di dieci foto. La prima volta su un servizio, usa il tasto Prova su venti foto: in un minuto vedi il risultato.' },

    { sez: 'Installazione', t: 'Scarica il plugin.',
      n: ['Sul Mac apri questa pagina e tocca il tasto qui sotto', 'Apri il file DZAuto.zip che hai scaricato', 'Compare la cartella DZAuto.lrplugin: spostala in Documenti e non cancellarla'],
      link: { t: 'Scarica DZ Auto (Mac)', href: '../DZAuto.zip' },
      x: 'Hai già la versione 1? Non serve aggiungerlo di nuovo: segui la pagina "Aggiorna" che ti ha mandato Daniel.',
      v: 'Partiamo dall\'installazione. Sul Mac apri questa pagina e scarica il plugin con il tasto. Apri il file zip: compare una cartella che si chiama DZ Auto punto lrplugin. Spostala nella cartella Documenti, e non cancellarla: Lightroom la usa ogni volta. Se hai già la versione uno, segui invece la pagina Aggiorna che ti ha mandato Daniel.' },

    { sez: 'Installazione', t: 'Aggiungilo a Lightroom.',
      n: ['Apri Lightroom Classic', 'Menu File > Gestione plug-in (Plug-in Manager)', 'In basso a sinistra premi Aggiungi', 'Scegli la cartella DZAuto.lrplugin e conferma', 'Nell\'elenco compare DZ Auto con il pallino verde'],
      v: 'Ora apri Lightroom Classic. Dal menu File scegli Gestione plug-in. In basso a sinistra premi Aggiungi, scegli la cartella DZ Auto e conferma. Nell\'elenco compare DZ Auto, con il pallino verde.' },

    { sez: 'Installazione', t: 'Metti la chiave.',
      n: ['Sempre in Gestione plug-in, seleziona DZ Auto', 'Nel riquadro "DZ Auto: chiave" scrivi la chiave che ti ha mandato Daniel', 'Premi VERIFICA', 'Deve comparire: "Chiave valida fino al…"'],
      v: 'Adesso la chiave. Sempre in Gestione plug-in, seleziona DZ Auto. Nel riquadro della chiave scrivi quella che ti ha mandato Daniel, e premi Verifica. Deve comparire: chiave valida fino al, e la data.' },

    { sez: 'Installazione', t: 'Crea il preset "Automatico".',
      n: ['Una volta sola. Sviluppo > pannello Preset > + > Crea preset', 'Nome: Automatico', 'In basso: "Nessuno" (Check None)', 'Spunta solo "Impostazioni automatiche" (Auto Settings)', 'Premi Crea'],
      x: 'Serve per l\'esposizione automatica foto per foto. DZ Auto lo trova da solo.',
      v: 'Ora una cosa da fare una volta sola: il preset Automatico. Vai nel modulo Sviluppo. Nel pannello Preset, a sinistra, premi il più e scegli Crea preset. Come nome scrivi: Automatico. In basso premi Nessuno, così togli tutte le spunte. Poi spunta solo Impostazioni automatiche, e premi Crea. Serve per l\'esposizione automatica foto per foto: Lightroom non la lascia fare ai plugin in un altro modo. DZ Auto lo trova da solo, per nome.' },

    { sez: 'Installazione', t: 'Prova l\'avviso.',
      x: 'In Gestione plug-in, riquadro "Avvisi, orologi e tempo risparmiato", premi PROVA AVVISO: dopo qualche secondo arriva una mail sul telefono.',
      v: 'Ultima prova: in Gestione plug-in, nel riquadro Avvisi, orologi e tempo risparmiato, premi Prova avviso. Dopo qualche secondo ti arriva una mail sul telefono. Se arriva, è tutto pronto.' },

    { sez: 'Il pannello', t: 'Apri il pannello.',
      x: 'Menu File > Extra plug-in (Plug-in Extras) > DZ Auto: Pannello. C\'è anche nel menu Libreria > Extra plug-in.',
      l: ['Avvia: cosa fa e il tasto AVVIA', 'Scelta, Colore, Raddrizza e ritaglio, Bianco e nero', 'Altro: firma, raccolta, aggiornamenti, guida'],
      v: 'Il cuore di DZ Auto è il pannello. Lo apri dal menu File, Extra plug-in, DZ Auto Pannello. C\'è anche nel menu Libreria. Ha delle schede: Avvia, con il riassunto e il tasto Avvia. Poi Scelta, Colore, Raddrizza e ritaglio, Bianco e nero. E Altro, con firma, raccolta, aggiornamenti e guida. Ogni voce ha una riga che la spiega. Le scelte restano salvate.' },

    { sez: 'Il pannello', t: 'Su quali foto lavora.',
      l: ['Se selezioni più foto: solo quelle', 'Se no: tutte le foto della cartella o raccolta aperta', 'Scheda Scelta: puoi lavorare solo sulle foto con la bandierina'],
      v: 'Su quali foto lavora? Se selezioni più foto, solo su quelle. Altrimenti su tutte le foto della cartella o della raccolta che hai aperto. Nella scheda Scelta puoi decidere di lavorare solo sulle foto con la bandierina.' },

    { sez: 'Il pannello', t: 'Colore: il tuo stile.',
      n: ['Scheda Colore: per ogni fotocamera scegli il tuo preset', 'Forza: 100% = come il preset, meno = più delicato, più = più marcato', 'Bianco automatico e Esposizione automatica: lasciali accesi', 'Preset "Automatico": già scelto da solo se l\'hai creato'],
      x: 'Ordine: prima il tuo preset, poi la correzione. Curve e profilo restano i tuoi.',
      v: 'Scheda Colore. Per ogni fotocamera scegli il tuo preset, per esempio Matrimonio o Area ok. Con la forza decidi quanto: cento per cento è come il preset, meno è più delicato, più è più marcato. Lascia accesi bianco automatico ed esposizione automatica. Il preset Automatico è già scelto, se l\'hai creato. L\'ordine è: prima il tuo preset, poi la correzione foto per foto. Curve e profilo restano i tuoi.' },

    { sez: 'Il pannello', t: 'Raddrizza.',
      x: 'Usa Upright "Livello" di Lightroom: raddrizza l\'orizzonte e taglia i bordi bianchi. Su una foto che non ti piace: modulo Sviluppo, pannello Trasforma, togli Upright.',
      v: 'Raddrizza usa Upright Livello di Lightroom: raddrizza l\'orizzonte e taglia i bordi bianchi. Se su una foto non ti piace, nel modulo Sviluppo, pannello Trasforma, togli Upright. Il ritaglio sui volti dei primi piani arriva dopo, con una prova sul tuo Mac.' },

    { sez: 'Il pannello', t: 'Bianco e nero.',
      n: ['Nel modulo Libreria metti l\'etichetta Blu (tasto 9) alle foto da fare in bianco e nero', 'Scheda Bianco e nero: spunta la voce', 'Etichetta: Blu. Preset: il tuo, per esempio "Area bn"'],
      x: 'Su quelle foto DZ Auto mette il preset bianco e nero al posto dello stile a colori.',
      v: 'Il bianco e nero lo scegli tu. Nel modulo Libreria metti l\'etichetta blu, tasto nove, alle foto da fare in bianco e nero. Nella scheda Bianco e nero spunta la voce, lascia l\'etichetta blu e scegli il tuo preset, per esempio Area bn. Su quelle foto DZ Auto mette il bianco e nero al posto dello stile a colori.' },

    { sez: 'Il pannello', t: 'Scegli le foto.',
      l: ['Tasto P = scelta, tasto X = scartata', 'Selezione assistita di Lightroom: Impostazioni catalogo > Metadati, poi pannello Selezione assistita in Libreria', 'Alla fine: Applica azioni > Applica bandierina: Scelta. Non usare Elimina'],
      x: 'La scelta automatica di DZ Auto arriva dopo una prova sul tuo Mac.',
      v: 'Per scegliere le foto usa la bandierina: tasto P per tenerla, tasto X per scartarla. Oppure la Selezione assistita di Lightroom, che c\'è già nella tua versione: si attiva in Impostazioni catalogo, Metadati, e poi lavori nel suo pannello in Libreria. Alla fine applica la bandierina Scelta alle foto buone. Non usare Elimina. La scelta automatica di DZ Auto arriva dopo una prova sul tuo Mac.' },

    { sez: 'Usarlo', t: 'Prima: prova su 20 foto.',
      n: ['Apri il pannello e fai le tue scelte', 'Premi "Prova su 20 foto"', 'DZ Auto lavora su 20 foto sparse e ti dice com\'è andata', 'Le trovi nella raccolta DZ Auto > data prova'],
      x: 'La prima volta fai una foto alla finestra finale e mandala a Daniel: la riga "Controllo" dice se Lightroom ha preso tutto.',
      v: 'La prima volta su un servizio, fai la prova. Apri il pannello, fai le tue scelte, e premi Prova su venti foto. DZ Auto lavora su venti foto sparse, almeno una per fotocamera, e alla fine ti dice com\'è andata. Le trovi nella raccolta DZ Auto. La prima volta fai una foto alla finestra finale e mandala a Daniel: la riga Controllo dice se Lightroom ha preso tutto.' },

    { sez: 'Usarlo', t: 'Ti piace? AVVIA.',
      n: ['Apri il pannello e premi AVVIA', 'Puoi alzarti: alla fine arriva la mail sull\'iPhone', 'Le foto lavorate sono nella raccolta DZ Auto > data e nome', 'Le foto della prova non vengono lavorate due volte'],
      x: 'Per le volte dopo: File > Extra plug-in > DZ Auto: Avvia con le ultime scelte.',
      v: 'Ti piace? Apri il pannello e premi Avvia. Puoi alzarti dal Mac: quando ha finito ti arriva la mail sull\'iPhone. Le foto lavorate sono nella raccolta DZ Auto, con la data e il nome. Le foto della prova ripartono da com\'erano, quindi non vengono lavorate due volte. Per le volte dopo c\'è anche il comando veloce: Avvia con le ultime scelte.' },

    { sez: 'Usarlo', t: 'Non ti piace? Torna come prima.',
      x: 'File > Extra plug-in > DZ Auto: Torna come prima. Tutte le foto dell\'ultimo lavoro tornano all\'istantanea "DZ Auto - prima". Una foto sola: modulo Sviluppo, pannello Istantanee.',
      v: 'Non ti piace? Menu File, Extra plug-in, DZ Auto Torna come prima. Tutte le foto dell\'ultimo lavoro tornano com\'erano. Per una foto sola, nel modulo Sviluppo apri il pannello Istantanee e scegli DZ Auto prima. Poi cambi le scelte nel pannello e riprovi.' },

    { sez: 'Usarlo', t: 'Allinea gli orologi.',
      n: ['Scegli 2 foto dello stesso istante, una per fotocamera (il bacio, il lancio del riso)', 'Selezionale tutte e due', 'File > Extra plug-in > DZ Auto: Allinea orologi', 'Premi Salva'],
      x: 'I file non vengono toccati: serve per l\'ordine di scatto e della consegna.',
      v: 'Una volta per servizio, se usi due fotocamere: allinea gli orologi. Scegli due foto dello stesso istante, per esempio il bacio, una della D850 e una della Zeta 6 seconda. Selezionale tutte e due, scegli Allinea orologi e premi Salva. I file non vengono toccati: serve solo per l\'ordine.' },

    { sez: 'Usarlo', t: 'Esporta consegna (se vuoi).',
      n: ['File > Extra plug-in > DZ Auto: Esporta consegna', 'Nome del servizio e cartella', 'Alta qualità e Web, filigrana se serve, avviso acceso'],
      x: 'Cartelle "Rossi - Alta" e "Rossi - Web", file numerati in ordine di scatto. Se preferisci, esporta come sempre.',
      v: 'Per l\'esportazione puoi fare come sempre. Se vuoi, c\'è Esporta consegna: scrivi il nome del servizio, scegli la cartella, alta qualità e web, e la filigrana se ti serve. Troverai le cartelle Rossi alta e Rossi web, con i file numerati in ordine di scatto, e la mail sul telefono alla fine.' },

    { sez: 'Usarlo', t: 'Quanto tempo risparmi.',
      x: 'Alla fine di ogni lavoro e nella mail vedi il tempo risparmiato (stima). Il totale è nel pannello, scheda Avvia.',
      v: 'Alla fine di ogni lavoro, e nella mail, DZ Auto ti dice quanto tempo hai risparmiato. È una stima. Il totale lo trovi nel pannello, scheda Avvia.' },

    { sez: 'Usarlo', t: 'Aggiornamenti da soli.',
      n: ['Pannello > scheda Altro > CONTROLLA', 'Se c\'è una versione nuova premi AGGIORNA ORA', 'Chiudi e riapri Lightroom'],
      x: 'Oppure File > Extra plug-in > DZ Auto: Aggiorna. La chiave e le scelte restano.',
      v: 'Gli aggiornamenti arrivano da soli. Nel pannello, scheda Altro, premi Controlla. Se c\'è una versione nuova, premi Aggiorna ora, poi chiudi e riapri Lightroom. La chiave e le tue scelte restano.' },

    { sez: 'Consigli', t: 'Una seconda copia, gratis.',
      x: 'Quando importi: pannello Gestione file > "Crea una seconda copia in" > un disco esterno. Lightroom copia le foto in due posti mentre importa.',
      v: 'Un consiglio: quando importi, nel pannello Gestione file attiva Crea una seconda copia in, e scegli un disco esterno. Lightroom copia le foto in due posti mentre importa. Decidi tu.' },

    { sez: 'Consigli', t: 'Più veloce con le anteprime avanzate.',
      x: 'Quando importi: "Genera Anteprime avanzate". Lo sviluppo diventa più fluido.',
      v: 'Altro consiglio: quando importi, attiva Genera anteprime avanzate. Lo sviluppo diventa più fluido.' },

    { sez: 'Aiuto', t: 'Se qualcosa non va.',
      n: ['Fai una foto alla finestra finale di DZ Auto', 'Oppure: File > Gestione plug-in > DZ Auto > MOSTRA DIAGNOSTICA, copia il testo', 'Mandalo con "Domande e suggerimenti"'],
      v: 'Se qualcosa non va, niente paura. Fai una foto alla finestra finale di DZ Auto, oppure in Gestione plug-in premi Mostra diagnostica e copia il testo. Mandacelo con il tasto Domande: lo leggiamo e ti rispondiamo.' },

    { sez: 'Aiuto', t: 'Domande, richieste, idee?', fine: true,
      x: 'Scrivile qui: le leggiamo tutte. Anche un suggerimento piccolo ci aiuta a migliorare DZ Auto per te.',
      link: { t: 'Scrivi domande o suggerimenti', href: 'https://milkbarandcoffe-web.github.io/dzauto-domande/', nuova: true },
      v: 'Hai domande, richieste o idee? Scrivile qui, con il tasto. Le leggiamo tutte. Buon lavoro, Luca!' }
  ]
};
</script>
<script src="../../presenta/motore.js"></script>
</body>
