<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1A2B">
<title>DZ Auto il tuo stile</title>
<meta name="description" content="Messaggio parlato per Luca: il questionario per insegnare a DZ Auto il suo stile e le sue scelte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../presenta/stile.css">
<style>
:root{--fondo:#0E1A2B;--fondo2:#17304D;--carta:#EAF2FB;--tenue:#9FB4CC;--accento:#5AB0FF;--su-accento:#06182B;--linea:rgba(234,242,251,.16)}
</style>

<body>
<noscript>Per ascoltare il messaggio serve JavaScript attivo.</noscript>
<script>
// Messaggio per Luca (16/11/2026): c'e un questionario nella pagina Aiuto; poi passi guidati per imparare stile e scelte.
window.PRES = {
  id: 'dzauto-stile-1',
  marchio: 'DZ Auto · il tuo stile',
  vel: 1.2,
  tono: 0.85,
  strumenti: ['voce'],
  pronuncia: [['DZ Auto', 'Di Zeta Auto'], ['Lightroom', 'Lait rum'], ['plug-in', 'plag in']],
  inizio: {
    t: 'Il tuo stile',
    x: 'Un minuto per sapere cosa ti abbiamo preparato. Alza il volume e tocca play.',
    firma: 'idea e sviluppo by Daniel Zavan'
  },
  slide: [
    { t: 'Ciao Luca!',
      x: 'Ti abbiamo preparato un questionario: 15 domande, rispondi con un clic. Tre minuti.',
      v: 'Ciao Luca! Ti abbiamo preparato un questionario. Sono quindici domande e rispondi con un clic: ci vogliono tre minuti.' },

    { t: 'A cosa serve.',
      x: 'Vogliamo che DZ Auto lavori come lavori tu. Per questo deve imparare:',
      l: ['Le foto che scegli', 'Come le sistemi', 'Come le ritagli', 'Quando usi il bianco e nero'],
      v: 'A cosa serve? Vogliamo che DZ Auto lavori come lavori tu. Per farlo deve imparare il tuo stile e le tue scelte: quali foto scegli, come le sistemi, come le ritagli e quando usi il bianco e nero.' },

    { t: 'Poi, un passo alla volta.',
      x: 'In base alle tue risposte ti diamo dei passi da fare in Lightroom, sui servizi che hai già consegnato. Così DZ Auto impara il più possibile da quello che hai già fatto.',
      v: 'Dopo, in base alle tue risposte, ti diamo dei passi da fare in Lightroom, uno alla volta, sui servizi che hai già consegnato. Così DZ Auto impara il più possibile da quello che hai già fatto tu.' },

    { t: 'Dove trovi il questionario.',
      n: ['Apri Lightroom Classic', 'File > Extra plug-in > DZ Auto: Aiuto e messaggi', 'In alto: "Domande per imparare il tuo stile" > INIZIA', 'Alla fine premi INVIA'],
      x: 'Ti arriva anche una mail di DZ Auto con il link.',
      v: 'Dove lo trovi? Apri Lightroom. Menu File, Extra plug-in, DZ Auto Aiuto e messaggi. Si apre la tua pagina: in alto trovi Domande per imparare il tuo stile. Premi Inizia e, alla fine, Invia. Ti arriva anche una mail di DZ Auto con il link.' },

    { t: 'Grazie!', fine: true,
      x: 'L\'obiettivo: automatizzare il più possibile, facendo quello che faresti tu.',
      v: 'L\'obiettivo è automatizzare il più possibile, facendo quello che faresti tu. Grazie Luca!' }
  ]
};
</script>
<script src="../../presenta/motore.js"></script>
</body>
</html>
