<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DZ App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0a0a0b}
body{color:#eee;font:15px/1.45 system-ui,sans-serif;min-height:100vh;background:radial-gradient(circle at 15% -5%,rgba(92,225,230,.13),transparent 45%),radial-gradient(circle at 105% 35%,rgba(192,132,252,.12),transparent 45%),#0a0a0b}
.pg{max-width:460px;margin:0 auto;padding:36px 16px 40px}
.lt{font:700 34px/1.2 system-ui,sans-serif;letter-spacing:.04em;text-align:center;background:linear-gradient(90deg,#9EFF9E,#5CE1E6,#7AA2FF,#C084FC,#FF7AB6,#C084FC,#7AA2FF,#5CE1E6,#9EFF9E);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sf 3s linear infinite}
@keyframes sf{to{background-position:-200% 0}}
.ls{font-size:13.5px;color:#8C8C8C;margin-top:6px;text-align:center}
.card{background:rgba(26,26,31,.9);border:1px solid #2a2a30;border-radius:16px;padding:16px;margin-top:22px}
.k{margin-top:10px;padding:14px;border-radius:12px;background:#111;border:1px dashed #3a3a42;text-align:center;font:700 22px ui-monospace,monospace;letter-spacing:.12em;color:#fff;user-select:all;-webkit-user-select:all}
.bt{display:block;width:100%;margin-top:12px;padding:15px;border-radius:13px;border:0;font:700 15.5px system-ui,sans-serif;color:#fff;text-align:center;text-decoration:none;background:#534AB7;cursor:pointer}
.bt.sec{background:#1d1d22;border:1px solid #3a3a42;color:#eee}
.passi{margin-top:6px;counter-reset:n}
.passi p{position:relative;padding-left:30px;margin-top:10px;font-size:14px}
.passi p:before{counter-increment:n;content:counter(n);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:#2a2a30;color:#ddd;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.nota{font-size:13px;color:#aaa;margin-top:12px}
.err{color:#ff8080}
.firma{text-align:center;color:#666;font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="pg" id="pg">
<div class="lt">DZ App</div>
<div class="ls">idea e sviluppo by Daniel Zavan</div>
<div id="main"></div>
<div class="firma">idea e sviluppo by Daniel Zavan</div>
</div>
<script>
// Pagina del link della mail: apre DZ App con la chiave, oppure la scarica. Senza Android: installazione nel browser.
// os=ios / os=android (tasti della mail) decide quali passi mostrare; senza, decide il telefono.
var APK='https://github.com/milkbarandcoffe-web/app-install/releases/download/dz-app/DZ-App.apk';
var PACCHETTO_ANDROID='com.dz.install.dz_app';
var INSTALLER='https://script.google.com/macros/s/AKfycbzoZTOCdMxhSilwoApDHsDg_5vImajdkOvf7OdJ0Lt_8eaepzvEn3qb5OblnFV3xXDALg/exec';
var SERVIZIO='https://script.google.com/macros/s/AKfycbyOMTa6oda0aBSEjd_AEK3Jjrd_IdzFrAlvQZ7BdW2HL7-4Lgb2XV_cphTm89NIqPttXQ/exec';
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function chiave(){var m=/[?&]k=([^&#]+)/.exec(location.search),k=m?decodeURIComponent(m[1]):'';k=k.toUpperCase().replace(/[^A-Z0-9]/g,'');return k.length===12?k.slice(0,4)+'-'+k.slice(4,8)+'-'+k.slice(8):'';}
var OS=(/[?&]os=(ios|android)/i.exec(location.search)||[])[1]||'',UA=navigator.userAgent;
var K=chiave(),M=document.getElementById('main'),ios=OS?OS.toLowerCase()==='ios':/iphone|ipad|ipod/i.test(UA)||(/macintosh/i.test(UA)&&navigator.maxTouchPoints>1),android=!ios&&(OS?true:/android/i.test(UA));
var c=el('div','card');
if(!K){
c.appendChild(el('b','','Link senza chiave'));
c.appendChild(el('div','nota err','Questo link non contiene una chiave valida. Chiedi il link giusto a chi te lo ha mandato.'));
var s0=el('a','bt sec','SCARICA DZ App');s0.href=APK;c.appendChild(s0);
}else if(ios){
c.appendChild(el('b','','La tua chiave · iPhone'));
c.appendChild(el('div','k',K));
var pi=el('div','passi');
pi.appendChild(el('p','','Tocca APRI L\'INSTALLAZIONE: si apre qui in Safari, la chiave è già dentro.'));
pi.appendChild(el('p','','Accedi con il tuo account Google e segui i passi sullo schermo.'));
pi.appendChild(el('p','','Alla fine apri l\'app e aggiungila alla schermata Home: tasto Condividi, poi Aggiungi alla schermata Home.'));
c.appendChild(pi);
var bi=el('a','bt','APRI L\'INSTALLAZIONE');bi.href=INSTALLER+'?k='+encodeURIComponent(K)+'&s='+encodeURIComponent(SERVIZIO);
c.appendChild(bi);
c.appendChild(el('div','nota','Su iPhone non serve DZ App: l\'app funziona nel browser.'));
}else{
c.appendChild(el('b','','La tua chiave'));
c.appendChild(el('div','k',K));
var ps=el('div','passi');
ps.appendChild(el('p','','Se non hai ancora DZ App: premi SCARICA DZ App e installala (Android può chiedere di consentire l\'installazione da questa fonte).'));
ps.appendChild(el('p','','Torna su questa pagina e premi APRI DZ App: la chiave entra da sola.'));
ps.appendChild(el('p','','Accedi con il tuo account Google e segui i passi.'));
c.appendChild(ps);
var ap=el('a','bt','APRI DZ App');
ap.href='intent://chiave?k='+encodeURIComponent(K)+'#Intent;scheme=dzapp;package='+PACCHETTO_ANDROID+';S.browser_fallback_url='+encodeURIComponent(APK)+';end';
var sc=el('a','bt sec','SCARICA DZ App');sc.href=APK;
var br=el('a','bt sec','Non ho Android: apri nel browser');br.href=INSTALLER+'?k='+encodeURIComponent(K)+'&s='+encodeURIComponent(SERVIZIO);br.target='_blank';
if(android){c.appendChild(ap);c.appendChild(sc);}else{c.appendChild(br);}
c.appendChild(el('div','nota','Se APRI DZ App non fa niente: apri DZ App, tocca + e scrivi la chiave qui sopra.'));
if(android)c.appendChild(br);
}
M.appendChild(c);
</script>
</body>
</html>
