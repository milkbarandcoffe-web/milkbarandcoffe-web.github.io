window.PRES = {

  strumenti: ['voce', 'indice', 'testo'],

    t: 'Ciao{NOME}!',

  slide: [
    { sez: 'Le novità', t: 'Cosa è cambiato',
      x: 'Abbiamo riorganizzato listini e prezzi della cassa. Adesso è tutto più semplice: per te, per la cassa e per l’ufficio.',
      v: 'Ciao{NOME}! Questa è una presentazione breve sulle novità della cassa e del tablet. Abbiamo riorganizzato listini e prezzi: adesso è tutto più semplice, per te, per la cassa e per l’ufficio. Ti spiego tutto in tre minuti.' },

    { sez: 'Le novità', t: 'Sul tablet scegli il listino',

    { sez: 'Le novità', t: 'I prezzi cambiano da soli',

    { sez: 'Le novità', t: 'I prezzi li decide l’ufficio',

    { sez: 'Il tuo listino', t: 'Il tuo listino lo scegli tu', img: 'mio-listino.jpg', alt: 'Pagina Il mio listino: categorie che si aprono, una spunta per ogni articolo, prezzi banco e tavolo, tasto SALVA',
