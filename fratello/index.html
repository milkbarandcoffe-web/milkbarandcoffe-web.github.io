<!DOCTYPE html>

<title>Piccolo fratello, siediti: la saga di IPRATICO-X</title>
<meta name="description" content="Presentazione parlata per il piccolo fratello Christian: come è nata IPRATICO-X e come si usa.">
<link rel="preconnect" href="https://fonts.googleapis.com">

:root{
  --fondo:#1E1714;--fondo2:#3A2A22;--carta:#FCE9DC;--tenue:#D9B9A3;
  --accento:#FF8A50;--su-accento:#1E1714;--linea:rgba(252,233,220,.18);
  --titoli:"Oswald",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
h1{text-transform:uppercase;letter-spacing:0}
</style>

<body>
<noscript>Per ascoltare la presentazione serve JavaScript attivo.</noscript>
<script>
// Presentazione per il piccolo fratello Christian (16/11/2026). Voce del telefono.
window.PRES = {
  id: 'fratello',
  marchio: 'Pasticceria Zavan · IPRATICO-X',
  vel: 1.2,
  tono: 0.85,
  pronuncia: [['IPRATICO-X', 'I Pratico ics'], ['Claude-X', 'Clod Ics'], ['Claude', 'Clod'], ['CASSA M/P', 'cassa M P'], ['Cassa M/P', 'Cassa M P'], ['A0', 'A zero'], ['A3', 'A tre']],
  etichette: { tu: 'Grande fratello', ai: 'Claude' },
  strumenti: ['voce', 'indice', 'testo'],
  inizio: {
    t: 'Piccolo fratello, siediti.',
    x: 'La saga di IPRATICO-X, raccontata da Claude. Circa 5 minuti: alza il volume e tocca play.',
    chat: [
      { da: 'tu', t: 'Claude, spiega tutto a mio fratello. E prendilo pure un po’ in giro.' },
      { da: 'ai', t: 'Con piacere. Piccolo fratello, mettiti comodo.' }
    ],
    firma: 'Idea e sviluppo Daniel Zavan · Claude-X · 16 novembre 2026'
  },
  slide: [
    { sez: 'La storia', t: 'Tutto comincia da un file.',
      x: '14 novembre: il grande fratello scarica dal registratore di cassa fiscale il file con tutti i prezzi. 571 prodotti, 45 colonne. Da lì si parte.',
      v: 'Ciao piccolo fratello! Mettiti comodo, ti racconto una storia. Tutto comincia il quattordici novembre. Il grande fratello scarica dal registratore di cassa fiscale il file con tutti i prezzi: cinquecentosettantuno prodotti, quarantacinque colonne. Io lo trasformo in un foglio Google, e da lì si parte.' },

    { sez: 'La storia', t: 'La grande pulizia.',
      l: ['280 punti tolti dai nomi dei prodotti', 'Prodotti senza prezzo: eliminati', 'Doppioni: lasciati, perché il grande fratello sa cose'],
      v: 'Poi la grande pulizia. Nomi doppi, spazi in fondo, errori di battitura, e duecentottanta punti sparsi nei nomi. Via tutti. I prodotti senza prezzo li abbiamo eliminati. I doppioni invece no, perché il grande fratello sa cose che noi non sappiamo.' },

    { sez: 'La storia', t: 'Il caso Ovetto.',
      x: 'Nei biscotti è un pasticcino a forma di uovo. Nelle caramelle è l’ovetto Kinder. Stesso nome, due mondi.',
      v: 'Esempio: il caso Ovetto. Nei biscotti, l’ovetto è un pasticcino a forma di uovo. Nelle caramelle, è l’ovetto Kinder. Stesso nome, due mondi. Piccolo fratello, non confonderli mai: ne va della tua reputazione.' },

    { sez: 'La storia', t: 'Claude entra in cassa.',
      x: 'Dal PC del grande fratello, con Chrome, Claude entra in iPratico Cloud e sistema prodotti, varianti e categorie.',
      chat: [
        { da: 'tu', t: 'Fai vedere a mio fratello che gestisci la pagina.' },
        { da: 'ai', t: '👋 Ciao! Sono Claude. Sto gestendo questa pagina di iPratico Cloud per la Pasticceria Zavan.' }
      ],
      v: 'Poi sono entrato in cassa. Dal computer del grande fratello, con Chrome, ho aperto iPratico Cloud e ho sistemato prodotti, varianti e categorie. A un certo punto il grande fratello mi dice: fai vedere a mio fratello che gestisci la pagina. E sullo schermo è comparso un bel riquadro arancione: Ciao! Sono Claude. Sì, piccolo fratello: quel saluto era per te. Non montarti la testa.' },

    { sez: 'La storia', t: 'Le chiamate all’assistenza.',
      l: ['La domanda: una schermata “preferiti” con i prodotti della caffetteria', 'Prima risposta: i tag. Funzionano, ma uno alla volta', 'Soluzione: due listini nuovi, CASSA MATTINA e CASSA POMERIGGIO'],
      v: 'Poi le chiamate all’assistenza di iPratico. Il grande fratello voleva una schermata preferiti, con i prodotti della caffetteria a portata di dito. Prima risposta: ci sono i tag. Funzionano, ma uno alla volta, e la ricerca non resta salvata. Alla fine l’assistenza ha creato due listini nuovi, cassa mattina e cassa pomeriggio, e lì teniamo visibili solo i prodotti giusti. Il grande fratello al telefono: paziente, insistente, vincente.' },

    { sez: 'La storia', t: 'L’idea del grande fratello.',
      chat: [
        { da: 'tu', t: 'E con Claude-X non facciamo un’app che lo fa da sola?' },
        { da: 'ai', t: 'Adesso non si può.' },
        { da: 'ai', chi: 'Claude, la mattina dopo', t: 'Si può. Fatto.' }
      ],
      v: 'E qui arriva l’idea del grande fratello. Una sera mi chiede: e con Claude-X non facciamo un’app che lo fa da sola, senza il computer acceso? Io, stanco, rispondo: adesso non si può. La mattina dopo, l’app era fatta. Il grande fratello aveva ragione. Di nuovo. Piccolo fratello, prendi appunti.' },

    { sez: 'La storia', t: 'Cosa ha fatto in cassa.',
      l: ['566 prodotti importati, controllati uno per uno: zero errori', 'Uscita 1 bar, uscita 2 cibo: prima si beve, poi si mastica', 'Tutte le categorie collegate alle stampanti'],
      v: 'L’app è entrata in cassa da sola. Cinquecentosessantasei prodotti importati, con nomi, prezzi e varianti controllati uno per uno: zero errori. Sulla comanda, uscita uno per il bar e uscita due per il cibo: prima si beve, poi si mastica. E tutte le categorie collegate alle stampanti.' },

    { sez: 'La storia', t: 'Nasce IPRATICO-X.',
      x: 'Il pannello della cassa sul telefono: prezzi, articoli, cosa si vede in cassa, listini da appendere. Ogni modifica tiene una copia di prima.',
      v: 'E così è nata IPRATICO-X: il pannello di controllo della cassa, direttamente sul telefono. Prezzi, articoli, cosa si vede in cassa la mattina e il pomeriggio, e i listini da appendere. Ogni modifica tiene una copia di com’era prima. Se combini un pasticcio, si torna indietro. Ora ti faccio vedere come si usa.' },

    { sez: 'Come si usa', t: 'Entrare: il PIN.', img: 'pin.jpg', alt: 'Schermata del PIN di IPRATICO-X con il campo e il tasto ENTRA evidenziati',
      n: ['Scrivi il PIN. Te lo dice il grande fratello, a voce', 'Premi ENTRA. Su quel telefono non te lo chiede più'],
      v: 'Primo passo: entrare. Apri l’app e scrivi il PIN. Il PIN te lo dice il grande fratello, a voce: qui non c’è, ovviamente. Poi premi Entra. Su quel telefono non te lo chiede più. Attenzione: dopo cinque PIN sbagliati l’app si blocca per un quarto d’ora. Quindi niente tentativi a caso.' },

    { sez: 'Come si usa', t: 'La home.', img: 'home.jpg', alt: 'Home di IPRATICO-X con quattro tasti numerati',
      n: ['CASSA M/P: cosa si vede in cassa mattina e pomeriggio', 'ARTICOLI: cerca un prodotto e cambia prezzi e nome', 'AGGIUNGI ARTICOLO: un prodotto nuovo', 'STAMPA LISTINI: il listino prezzi da appendere'],
      v: 'Questa è la home. In alto le cose di tutti i giorni. Uno: cassa M P, cosa si vede in cassa la mattina e il pomeriggio. Due: articoli, per cercare un prodotto e cambiare prezzi e nome. Tre: aggiungi articolo, per un prodotto nuovo. Quattro: stampa listini, il listino prezzi da appendere. In fondo ci sono controlli e impostazioni: lì, piccolo fratello, non si gioca.' },

    { sez: 'Come si usa', t: 'Cassa M/P.', img: 'cassa.jpg', alt: 'Pagina CASSA M/P con la categoria aperta, una spunta P e il tasto SALVA evidenziati',
      n: ['Apri la categoria, per esempio CAFFETT', 'Spunta M per la mattina, P per il pomeriggio', 'Premi SALVA in basso'],
      v: 'Cassa M P. Apri la categoria, per esempio caffetteria. Accanto a ogni prodotto ci sono due spunte: M, visibile nella cassa della mattina, e P, visibile nel pomeriggio. Poi premi Salva in basso. Senza Salva non succede niente: le spunte da sole non bastano.' },

    { sez: 'Come si usa', t: 'Articoli.', img: 'art.jpg', alt: 'Scheda del cappuccino con nome, uscita, prezzi e tasto SALVA PRODOTTO evidenziati',
      n: ['Il nome come lo vede la cassa', 'L’uscita: 1 bar, 2 cibo', 'I prezzi banco e tavolo, mattina e pomeriggio', 'SALVA PRODOTTO'],
      v: 'Articoli. Cerchi il prodotto in alto e lo tocchi: si apre la sua scheda. Uno, il nome come lo vede la cassa. Due, l’uscita: uno bar, due cibo. Tre, i prezzi, banco e tavolo, mattina e pomeriggio. Quattro, salva prodotto. E il cappuccino al banco resta a un euro e ottanta, eh. Niente sconti agli amici.' },

    { sez: 'Come si usa', t: 'Aggiungi articolo.', img: 'nuovo.jpg', alt: 'Pagina aggiungi articolo compilata con nome, categoria, prezzi e tasto CREA ARTICOLO evidenziati',
      n: ['Il nome del prodotto nuovo', 'La categoria: copia IVA e varianti da un prodotto vicino', 'I prezzi banco e tavolo', 'CREA ARTICOLO'],
      v: 'Aggiungi articolo. Scrivi il nome, scegli la categoria, che copia IVA e varianti da un prodotto vicino, metti i prezzi banco e tavolo, e premi Crea articolo. Se deve vedersi in cassa, spunta mattina o pomeriggio. Il Marocchino XL della foto è solo un esempio: non inventarti prodotti per fame.' },

    { sez: 'Come si usa', t: 'Stampa listini.', img: 'cartello.jpg', alt: 'Pagina stampa listini con i tasti CREA LISTINO, APRI PDF E STAMPA e MODIFICA VOCI evidenziati',
      n: ['CREA LISTINO: prende i prezzi attuali della cassa', 'APRI PDF E STAMPA: A3 all’entrata, A0 sopra la vetrina dei gelati', 'MODIFICA VOCI: quali prodotti e in che ordine'],
      v: 'Stampa listini. Uno: crea listino, che prende i prezzi attuali della cassa. Due: apri PDF e stampa, in A3 per l’entrata e in A0 sopra la vetrina dei gelati. Tre: modifica voci, per scegliere quali prodotti e in che ordine. Cambi un prezzo in cassa, premi crea listino, e il cartello è già giusto. Addio pennarello.' },

    { sez: 'Come si usa', t: 'Il risultato.', img: 'listino.jpg', alt: 'Listino prezzi della Pasticceria Zavan creato dall’app',
      x: 'Logo, prezzi banco e tavolo, tutto preso dalla cassa.',
      v: 'Ed ecco il risultato. Logo, prezzi banco e tavolo, tutto preso direttamente dalla cassa. Bello, vero? Il merito è del grande fratello. E un pochino anche mio.' },

    { sez: 'Come si usa', t: 'Storico: il paracadute.', img: 'storico.jpg', alt: 'Pagina storico con il tasto ANNULLA evidenziato',
      n: ['ANNULLA, tocca due volte: i prodotti tornano come prima'],
      v: 'Ultima cosa: lo storico, il paracadute. Ogni salvataggio tiene una copia di com’era prima. Se sbagli, premi Annulla, e tocca due volte: i prodotti tornano come prima. Creato apposta per il piccolo fratello. Non è un’accusa, è prevenzione.' },

    { sez: 'Saluti', t: 'Regole d’oro.', fine: true,
      l: ['Ogni pagina ha il suo SALVA: senza, non cambia niente', 'Il PIN resta in famiglia: con l’app si cambia la cassa vera', 'Nel dubbio chiedi al grande fratello. Lui chiederà a Claude'],
      link: { t: 'Apri IPRATICO-X', href: '../ipx/', nuova: true },
      v: 'Le regole d’oro. Uno: ogni pagina ha il suo salva, senza non cambia niente. Due: il PIN resta in famiglia, perché con questa app si cambia la cassa vera. Tre: nel dubbio, chiedi al grande fratello. Lui chiederà a me. Benvenuto a bordo, piccolo fratello!' }
  ]
};
</script>
